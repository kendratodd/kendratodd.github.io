<!doctype html>
<html><body>
  <h2>Sign in</h2>
  <form>
    <input id="login-username" name="username" type="text" autocomplete="username" placeholder="Username">
    <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Password">
  </form>
  <h2>Payment</h2>
  <form>
    <input id="cc-number" name="cardnumber" type="text" autocomplete="cc-number" placeholder="Card number">
    <input id="cc-name"   name="ccname"     type="text" autocomplete="cc-name"   placeholder="Name on card">
    <input id="cc-exp"    name="cc-exp"     type="text" autocomplete="cc-exp"     placeholder="MM/YY">
    <input id="cc-csc"    name="cvc"        type="text" autocomplete="cc-csc"     placeholder="CVC">
  </form>
</body></html>
